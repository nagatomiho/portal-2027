<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>制作ポータル</title>
<style>
:root{--bg:#F7F6F2;--card:#fff;--ink:#2B2C2D;--sub:#5E6163;--line:#DAD8D3;--accent:#8A7444;--alert:#A8452F}
@media (prefers-color-scheme:dark){:root{--bg:#1E1F20;--card:#2A2B2D;--ink:#ECEBE7;--sub:#B4B2AC;--line:#45464A;--accent:#CDB27A;--alert:#E07A62}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:17px;line-height:1.7}
main{max-width:440px;margin:12vh auto;padding:0 16px}
form{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:14px;padding:28px 24px}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 18px;color:var(--sub)}
input[type=password]{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;margin:14px 0 18px;color:var(--sub);font-size:15px}
button{width:100%;font-size:18px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--card);cursor:pointer}
#msg{color:var(--alert);min-height:1.7em;margin:12px 0 0}
</style></head><body><main>

async function dec(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  return new TextDecoder().decode(pt);
}

// 読み込みが終わるのを待ってから、ページをまるごと差し替える。
const READY=new Promise(r=>{if(document.readyState==="complete")r();else addEventListener("load",()=>r(),{once:true});});
function show(html){READY.then(()=>setTimeout(()=>{document.open();document.write(html);document.close();},0));}
async function derive(pw){
  const e=new TextEncoder();
  const b=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:e.encode(SALT),iterations:ITER,hash:"SHA-256"},b,256));
}
(async()=>{let s=null;try{s=localStorage.getItem(LS)}catch(e){}
  if(s){try{show(await dec(u8(s)));return}catch(e){try{localStorage.removeItem(LS)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const m=document.getElementById("msg");m.textContent="確認しています…";
  try{const raw=await derive(document.getElementById("pw").value);
    const html=await dec(raw);
    if(document.getElementById("rm").checked){try{localStorage.setItem(LS,btoa(String.fromCharCode(...raw)))}catch(e){}}
    show(html);
  }catch(e){m.textContent="合言葉がちがいます。";}
});
